<!doctype html>
<html lang="en">
<head>
  <!-- Cloudflare Web Analytics -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"227baeece0c24c959606461ae7de2c97"}'></script>
  <!-- End Cloudflare Web Analytics -->

  <meta charset="utf-8" />
  <title>Flappy — Leaderboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- Global site styles (match the main frontend) -->
  <link rel="stylesheet" href="../assets/css/style.css" />

  <!-- Same libs your site uses (starfield/reveal handled in app.js) -->
  <script defer src="https://unpkg.com/swup@4"></script>
  <script defer src="../assets/js/app.js"></script>

  <!-- Game-specific + mobile nav styles -->
  <style>
    :root { --tap: 48px; }

    /* ===== Layout (leaderboard + game) ===== */
    .wrap {
      display:grid;
      grid-template-columns: 360px 1fr;
      grid-template-areas: "left right";
      gap:16px; padding:0 20px 20px; max-width:1200px; margin:0 auto;

      /* give it height and center rows vertically */
      min-height: 100vh;
      align-content: center;
    }
    .left  { grid-area:left; }
    .right { grid-area:right; }

    .card {
      background:var(--card);
      border:1px solid #243055;
      border-radius:14px;
      padding:14px;
      box-shadow:0 12px 30px rgba(6,10,20,.25) inset, 0 1px 0 rgba(255,255,255,.04);
    }
    .title { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .title h2 { margin:0; font-size:14px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); }
    .title small { color:var(--muted); }

    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    input[type="email"], input[type="text"] {
      background:#0c0f1e; color:var(--ink); border:1px solid #25335f; border-radius:10px; padding:10px 12px;
      flex:1 1 180px; outline:none;
    }
    button {
      appearance:none; border:1px solid #2c3a6b; background:linear-gradient(#1d2647,#0f1531);
      color:#eaf2ff; border-radius:10px; padding:10px 12px; cursor:pointer; font-weight:600;
    }
    button:hover { border-color:#3b4c85; }

    .muted { color:var(--muted); }

    ul.lb { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
    ul.lb li {
      display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px;
      background:#0c1023; border:1px solid #222f5a; border-radius:10px;
    }
    ul.lb li strong { font-variant-numeric: tabular-nums; }

    #lb li.me { outline:2px solid #48a3ff; border-radius:8px; }
    #lb li .you { margin-left:.4ch; font-weight:600; color:#8fd0ff; }
    .meBest { margin:6px 0 10px; color:var(--muted); font-size:13px; }
    .meBest strong { color:var(--ink); }
    .meBest .rank { color:var(--accent); font-weight:600; margin-left:.3ch; }

    .card.gameBox { display:grid; place-items:center; position:relative; padding:14px; }

    /* Default: size by width (mobile/tablet) */
    #gameFrame {
      max-width: 100%;
      width: min(92vw, 420px);
      aspect-ratio: 21 / 32;
      height: auto;
      display: block;
      margin: 0 auto;
      border:1px solid #243055;
      border-radius:12px;
      background:#000;
    }

    /* Desktop: size by available viewport height instead */
    @media (min-width: 900px) {
      #gameFrame {
        height: min(82vh, 860px);
        width: auto;
      }
    }

    .tapOverlay {
      position:absolute; inset:12px;
      display:none; place-items:center;
      border-radius:12px;
      border:1px dashed rgba(124,200,255,.55);
      background:linear-gradient(180deg, rgba(8,14,28,.30), rgba(8,14,28,.10));
      color:#dbe9ff;
      font-weight:700;
      text-shadow:0 1px 0 rgba(0,0,0,.5);
      pointer-events:none;
      transition:opacity .2s ease;
    }
    .tapOverlay.show { display:grid; }
    .tapOverlay.fade { opacity:0; }

    .me { margin-top:6px; font-size:13px; color:var(--muted); }

    /* ===== Mobile fixes ===== */
    html, body { overflow-x:hidden; }
    @media (max-width: 900px) {
      .wrap { grid-template-columns: 1fr; grid-template-areas: "right" "left"; }
      #gameFrame { width:min(92vw, 420px); }
    }
    @media (max-width: 480px) { button, input { font-size:16px; } }

    /* Use the site’s brand accent on specific bits */
    .accent { color: var(--accent); }
    header .tag { color: var(--accent); }

    /* ====== HAMBURGER NAV ====== */
    .nav .nav-inner { display:flex; align-items:center; gap:16px; }
    .nav .logo { flex:0 0 auto; }
    .nav .pill-nav {
      display:flex; gap:10px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
      max-width:100%; align-items:center; flex:1 1 auto; justify-content:center;
    }
    .nav .pill-nav::-webkit-scrollbar { display:none; }
    .nav .cta { flex:0 0 auto; }

    .nav-toggle {
      display:none;
      background:none;
      border:1px solid rgba(255,255,255,.08);
      color:var(--ink);
      border-radius:12px;
      padding:8px 12px;
      font-size:20px;
      line-height:1;
      cursor:pointer;
    }

    @media (max-width: 640px) {
      .nav .nav-inner {
        gap:10px; padding-left:12px; padding-right:12px;
        display:grid; grid-template-columns:auto 1fr auto; align-items:center;
      }
      .nav .logo { grid-column:1 / 2; }
      .nav-toggle { display:inline-flex; align-items:center; justify-content:center; grid-column:2 / 3; justify-self:center; }
      .nav .cta { grid-column:3 / 4; justify-self:end; }
      .nav .pill-nav { display:none; }
      .nav.open .pill-nav {
        display:flex; flex-direction:column; gap:8px; padding:10px;
        background:rgba(10,14,28,.6); border:1px solid rgba(255,255,255,.06); border-radius:14px;
        grid-column:1 / -1;
      }
    }
  </style>
</head>
<body>
  <!-- Starfield backdrop -->
  <canvas class="stars" aria-hidden="true"></canvas>

  <div class="wrap">
    <!-- LEFT: auth + leaderboard -->
    <section class="card left">
      <div class="title">
        <h2>Sign in</h2>
        <small id="me" class="me">Not signed in</small>
      </div>
      <div class="row" style="margin-bottom:8px">
        <input id="email" type="email" placeholder="you@email.com" />
        <button id="sendOtp" type="button">Send link</button>
      </div>
      <div class="row" style="margin-bottom:12px">
        <input id="otp" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="(optional) 6-digit code" />
        <button id="verifyOtp" type="button">Verify</button>
      </div>

      <div class="title" style="margin-top:12px">
        <h2>Top 10</h2>
      </div>
      <div id="myBest" class="meBest">Sign in to see your best & rank</div>
      <ul id="lb" class="lb">
        <li class="muted"><span>No scores yet — be the first!</span><strong>—</strong></li>
      </ul>
    </section>

    <!-- RIGHT: game -->
    <section class="card gameBox right">
      <div id="tapOverlay" class="tapOverlay"></div>
      <iframe id="gameFrame" title="Flappy Bara" allow="autoplay; gamepad *; fullscreen *"></iframe>
    </section>
  </div>

  <!-- Supabase + game wiring -->
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    /* --- Debug helpers (optional) --- */
    const DEBUG = false;
    let __debugBox = null;
    const log = (...args) => {
      if (!DEBUG) return;
      console.log("[SM]", ...args);
      if (!__debugBox) {
        const box = document.createElement("div");
        box.id = "debug";
        box.style.cssText = "position:fixed;left:8px;right:8px;bottom:8px;max-height:36vh;overflow:auto;background:#0b1022dd;border:1px solid #284;padding:8px;border-radius:8px;font:12px/1.4 monospace;z-index:9999;color:#cfe";
        box.innerHTML = "<b>Debug</b> — token & score flow logs";
        document.body.appendChild(box);
        __debugBox = box;
      }
      const p = document.createElement("div");
      p.textContent = args.map(String).join(" ");
      __debugBox.appendChild(p);
      __debugBox.scrollTop = __debugBox.scrollHeight;
    };

    /* --- Config --- */
    const SUPABASE_URL = "https://bncmbgjnelhythdhsefk.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJuY21iZ2puZWxoeXRoZGhzZWZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY2NjcxMDksImV4cCI6MjA3MjI0MzEwOX0.f9j3ExPfDIS3L_Jpg_kzxR-rXpJvTAPHpK6CzGsgOo0";

    /* --- DOM --- */
    const emailEl      = document.getElementById("email");
    const otpEl        = document.getElementById("otp");
    const meEl         = document.getElementById("me");
    const lbEl         = document.getElementById("lb");
    const sendOtpBtn   = document.getElementById("sendOtp");
    const verifyOtpBtn = document.getElementById("verifyOtp");
    const gameFrame    = document.getElementById("gameFrame");
    const tapOverlay   = document.getElementById("tapOverlay");

    /* --- Supabase client --- */
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    window.sb = sb;

    /* === Handle magic link tokens in URL hash === */
    async function handleSupabaseMagicLink() {
      const hash = location.hash && location.hash.startsWith('#') ? location.hash.slice(1) : '';
      if (!hash) return;
      const frag = new URLSearchParams(hash);
      const access_token  = frag.get('access_token');
      const refresh_token = frag.get('refresh_token');
      if (access_token && refresh_token) {
        try { await sb.auth.setSession({ access_token, refresh_token }); }
        catch (e) { console.warn('[auth] setSession from magic link failed:', e); }
        finally { history.replaceState({}, '', location.pathname + location.search); }
      }
    }
    await handleSupabaseMagicLink();

    /* --- Auth label --- */
    async function refreshUserLabel() {
      const { data: { user } } = await sb.auth.getUser();
      meEl.textContent = user ? `Signed in as ${user.email || user.id.slice(0,6)}…` : "Not signed in";
    }
    await sb.auth.getSession().catch(()=>{});
    await refreshUserLabel();
    sb.auth.onAuthStateChange(() => { refreshUserLabel(); loadBoard(); });

    /* --- Email OTP flow --- */
    sendOtpBtn.onclick = async () => {
      const email = emailEl.value.trim();
      const { error } = await sb.auth.signInWithOtp({
        email,
        options: {
          shouldCreateUser: true,
          emailRedirectTo: window.location.origin + "/game/"
        }
      });
      alert(error ? error.message : "A link or a 6-digit code was emailed to you.");
    };
    verifyOtpBtn.onclick = async () => {
      const code = otpEl.value.trim();
      if (!code) { await sb.auth.getSession().catch(()=>{}); await refreshUserLabel(); return; }
      if (!/^\d{6}$/.test(code)) { alert("Enter the 6-digit code only, or leave blank."); return; }
      const { error } = await sb.auth.verifyOtp({ email: emailEl.value.trim(), token: code, type: "email" });
      if (error) alert(error.message);
      await refreshUserLabel();
    };

    // --- Push my best score into the game iframe -------------------------------
    let lastMyBest = null;
    function setMyBestInGame(best) {
      lastMyBest = Number(best) || 0;
      const f = gameFrame?.contentWindow;
      try { if (f) f.__sm_my_best = lastMyBest; } catch {}
      try { localStorage.setItem('sm_my_best', String(lastMyBest)); } catch {}
      try { if (f) f.postMessage({ type: "SET_MY_BEST", best: lastMyBest }, "*"); } catch {}
    }

    // --- Leaderboard helpers ---
    const headers = {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`
    };
    const sameId = (a,b) => {
      const norm = x => (x ?? "").toString().trim().toLowerCase().replace(/-/g,"");
      return norm(a) === norm(b);
    };
    async function countGreaterThan(score) {
      const url = `${SUPABASE_URL}/rest/v1/leaderboard?select=best_score&best_score=gt.${encodeURIComponent(score)}`;
      const r = await fetch(url, { headers: { ...headers, Prefer: "count=exact", Range: "0-0" } });
      const cr = r.headers.get("content-range") || "";
      const m = /\/(\d+)$/.exec(cr);
      if (m) return parseInt(m[1], 10);
      try { const arr = await r.json(); return Array.isArray(arr) ? arr.length : 0; }
      catch { return 0; }
    }

    // --- Leaderboard renderer ---
    async function loadBoard() {
      const { data: { user } } = await sb.auth.getUser();
      const meId = (user?.id ?? "").toString().trim().toLowerCase();
      const myBestBox = document.getElementById('myBest');

      if (!meId && myBestBox) myBestBox.textContent = 'Sign in to see your best & rank';

      // Top 10
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/leaderboard?select=user_id,best_score&order=best_score.desc&limit=10`,
        { headers }
      );
      const rows = await res.json();

      lbEl.innerHTML = "";
      if (!rows.length) {
        const li = document.createElement("li"); li.className = "muted";
        li.innerHTML = `<span>No scores yet — be the first!</span><strong>—</strong>`;
        lbEl.appendChild(li);
        return;
      }

      let meShown = false;

      rows.forEach((r, i) => {
        const li = document.createElement("li");
        const uid = String(r.user_id);
        const short = uid.slice(0,8) + "…" + uid.slice(-4);
        const isMe = meId && sameId(uid, meId);

        li.innerHTML =
          `<span>#${i+1} ${short}${isMe ? ' <span class="you">(you)</span>' : ''}</span>` +
          `<strong>${r.best_score}</strong>`;

        if (isMe) { li.classList.add("me"); meShown = true; }
        lbEl.appendChild(li);
      });

      // Your best + rank (even if not in top 10)
      if (meId) {
        const meRes = await fetch(
          `${SUPABASE_URL}/rest/v1/leaderboard?select=user_id,best_score&user_id=eq.${meId}`,
          { headers }
        );
        const meRows = await meRes.json();
        const myBest = meRows?.[0] || null;

        let myRank = null;
        if (myBest && Number.isFinite(Number(myBest.best_score))) {
          const totalGt = await countGreaterThan(myBest.best_score);
          myRank = (totalGt || 0) + 1;
          setMyBestInGame(myBest.best_score);
        }

        if (myBestBox) {
          if (myBest) {
            myBestBox.innerHTML = `Your best: <strong>${myBest.best_score}</strong> <span class="rank">(rank ${myRank ?? "—"})</span>`;
          } else {
            myBestBox.innerHTML = `Your best: <strong>—</strong>`;
          }
        }

        if (!meShown) {
          const li = document.createElement("li");
          li.className = "me";
          const shortMe = meId.slice(0,8) + "…" + meId.slice(-4);
          li.innerHTML = `<span>Your best ${shortMe} <span class="you">(you)</span></span><strong>${myBest?.best_score ?? "—"}</strong>`;
          lbEl.appendChild(li);
        }
      }
    }

    window.loadBoard = loadBoard;
    loadBoard();

    /* === SCORE FLOW === */
    let currentTokenId = null;
    let currentUserId  = null;
    let lastCheckpointSent = 0;
    let _lockPosting = false;
    const CHECKPOINT_STEP = 1;

    const MIN = 1.10; // must match DB trigger/validation
    const tokenFrom = (d) => { if (Array.isArray(d)) d = d[0]; return d?.token ?? d?.id ?? d; };

    const G = { state:'IDLE', token:null, startAt:0, best:0, timer:null, lastStart:0 };
    const reset = () => { G.state='IDLE'; G.token=null; G.startAt=0; G.best=0; if (G.timer){clearTimeout(G.timer); G.timer=null;} };

    async function onRunStart() {
      if (_lockPosting) return;
      const now = Date.now();
      if (now - G.lastStart < 400) return;
      G.lastStart = now;

      if (G.state !== 'IDLE') {
        if (G.state === 'POSTING') return;
        reset();
      }

      const { data:{ user } = {} } = await sb.auth.getUser();
      if (!user) return log("Not signed in");

      currentUserId       = null;
      currentTokenId      = null;
      lastCheckpointSent  = 0;

      const { data, error } = await sb.rpc("start_run");
      if (error) { console.error("start_run error:", error); log("start_run error:", error.message || error); return; }

      G.token   = tokenFrom(data);
      G.startAt = performance.now();
      G.best    = 0;
      G.state   = 'WAITING';
      log("minted token", G.token);

      currentUserId  = user.id;
      currentTokenId = G.token;
      lastCheckpointSent = 0;

      hideTapOverlay();
    }

    function onScore(n) {
      if (G.state !== 'WAITING') return;
      const s = Number(n) || 0;
      if (s <= 0 || s <= G.best) return;
      G.best = s;
      if (G.timer) clearTimeout(G.timer);
      G.timer = setTimeout(postNow, 350);
      log("best =", G.best);
    }

    async function postNow() {
      if (G.state !== 'WAITING' || !G.token || G.best <= 0) return;

      const { data:{ user } = {} } = await sb.auth.getUser();
      if (!user) { reset(); return; }

      const elapsed  = (performance.now() - G.startAt) / 1000;
      const required = G.best * MIN;
      const waitMs   = Math.max(0, Math.ceil((required - elapsed) * 1000));
      if (waitMs) { log("waiting", waitMs, "ms (anti-cheat)"); await new Promise(r=>setTimeout(r, waitMs)); }

      if (lastCheckpointSent < G.best) {
        await new Promise(r => setTimeout(r, 150));
      }

      G.state = 'POSTING';
      const { error } = await sb.from("scores").insert({ user_id: user.id, token: G.token, score: G.best });
      if (error) { log("insert error:", error.message || error); reset(); return; }

      log("insert OK (score =", G.best, ")");
      await loadBoard();
      reset();
    }

    async function postCheckpoint(points, tokenSnap = currentTokenId, userSnap = currentUserId) {
      if (!tokenSnap || !userSnap) return;

      const { data:{ user } = {} } = await sb.auth.getUser();
      if (!user || user.id !== userSnap) return;

      await sb
        .from('run_checkpoints')
        .insert({ token: tokenSnap, user_id: userSnap, points })
        .select('id')
        .single()
        .throwOnError();

      lastCheckpointSent = Math.max(lastCheckpointSent, points);
    }

    async function postFinalScore(finalScore) {
      if (G.timer) { clearTimeout(G.timer); G.timer = null; }
      G.best = Number(finalScore) || 0;

      const { data:{ user } = {} } = await sb.auth.getUser();
      if (!user) { reset(); return; }

      const elapsed  = (performance.now() - G.startAt) / 1000;
      const required = G.best * MIN;
      const waitMs   = Math.max(0, Math.ceil((required - elapsed) * 1000));
      if (waitMs) { await new Promise(r => setTimeout(r, waitMs)); }

      if (lastCheckpointSent < G.best) {
        await new Promise(r => setTimeout(r, 150));
      }

      G.state = 'POSTING';
      const { error } = await sb.from("scores").insert({ user_id: user.id, token: G.token, score: G.best });
      if (error) { log("insert error:", error.message || error); reset(); return; }

      log("insert OK (score =", G.best, ")");
      await loadBoard();
      reset();
    }

    // Messages from the game (same-origin)
    window.addEventListener("message", async (e) => {
      if (e.origin && e.origin !== location.origin) return;
      const m = e.data;
      if (!m || typeof m !== "object") return;

      if (m.type === "RUN_START") {
        if (_lockPosting) return;
        onRunStart();

      } else if (m.type === "SCORE") {
        const s = Number(m.score) || 0;
        const tok = currentTokenId;
        const uid = currentUserId;

        _lockPosting = true;
        try {
          if (s > lastCheckpointSent) {
            try { await postCheckpoint(s, tok, uid); }
            catch (e2) { console.warn('final ckpt failed', e2); }
          }
          await postFinalScore(s);
        } finally {
          _lockPosting = false;
        }

      } else if (m.type === "SCORE_TICK") {
        if (!currentTokenId && G.state === 'IDLE') { onRunStart(); return; }
        const s = Number(m.score) || 0;
        if (s > lastCheckpointSent && (s === 1 || s >= lastCheckpointSent + CHECKPOINT_STEP)) {
          postCheckpoint(s);
        }
      }
    }, { capture: true });

    // Hook iframe console to translate game logs → messages
    function hookIframeConsole() {
      const f = gameFrame?.contentWindow;
      if (!f || f.__sm_console_hooked) return;
      try {
        f.__sm_console_hooked = true;
        const origLog = f.console.log.bind(f.console);
        f.console.log = function(...args) {
          try {
            for (const a of args) {
              if (typeof a !== "string") continue;

              if (a.startsWith("notify_run_start()")) {
                top.postMessage({ type: "RUN_START" }, "*");
              } else {
                let m;
                m = a.match(/^notify_score\((\d+)\)/);
                if (m) { top.postMessage({ type: "SCORE", score: Number(m[1]) }, "*"); continue; }
                m = a.match(/^notify_checkpoint\((\d+)\)/);
                if (m) { top.postMessage({ type: "SCORE_TICK", score: Number(m[1]) }, "*"); continue; }
              }
            }
          } catch {}
          return origLog(...args);
        };
      } catch (e) {
        console.warn("[SM] hook error:", e.message);
      }
    }

    // Wrap iframe globals if they ever exist
    function hookIframeGlobals() {
      const f = gameFrame?.contentWindow;
      if (!f) return;
      const wrap = (name, handler) => {
        try {
          let fn = f[name];
          if (typeof fn === "function" && !fn.__wrapped) {
            const w = function(...a){ try{ handler(...a); }catch{} return fn.apply(this,a); };
            w.__wrapped = true; f[name] = w;
          }
          Object.defineProperty(f, name, {
            configurable: true,
            get(){ return fn; },
            set(v){
              if (typeof v === "function") {
                fn = function(...a){ try{ handler(...a); }catch{} return v.apply(this,a); };
                fn.__wrapped = true;
              } else fn = v;
            }
          });
        } catch {}
      };

      wrap("notify_run_start", () => onRunStart());
      wrap("notify_score",     (n) => onScore(n));
      wrap("notify_checkpoint",(n) => { try { top.postMessage({ type:"SCORE_TICK", score: Number(n)||0 }, "*"); } catch {} });
    }

    /* === Tap overlay for phones === */
    /* === One real-gesture relay into the iframe (no canvas spam) === */
function showTapOverlay() {
  if (!tapOverlay) return;
  tapOverlay.textContent = 'Tap to start';
  tapOverlay.classList.add('show');
}
function hideTapOverlay() {
  if (!tapOverlay) return;
  tapOverlay.classList.add('fade');
  setTimeout(() => { try { tapOverlay.remove(); } catch {} }, 200);
}

/** Relay a *real* pointer event sequence into the iframe, at off-center points */
function relayGestureIntoIframe(ev) {
  const f = gameFrame?.contentWindow;
  if (!f) return;

  const doc = f.document;
  if (!doc) return;

  // find the bigger clickable container around the green button
  const label =
    doc.querySelector('label[for="run"], label[for="start"]') ||
    doc.querySelector('.pygbag-run, .start, .run, #gate, #pygbag-overlay, #status, #splash, button');

  const target = label || doc.querySelector('#run, #start') || doc.body;
  const r = target.getBoundingClientRect();

  // a few off-center points around the lower half (worked in your old build)
  const pts = [
    [r.left + r.width*0.50, r.top + r.height*0.66],
    [r.left + r.width*0.60, r.top + r.height*0.62],
    [r.left + r.width*0.40, r.top + r.height*0.62],
  ];

  const mk = (type, x, y) => {
    const o = { bubbles:true, cancelable:true, clientX:x, clientY:y, pointerId:1, pointerType:'touch' };
    try { return new f.PointerEvent(type, o); } catch {}
    try { return new f.MouseEvent(type, o); } catch {}
    return new MouseEvent(type, o);
  };

  // send one compact burst per point, but skip if it would land on the canvas
  for (let [x,y] of pts) {
    const hit = doc.elementFromPoint(x, y);
    if (hit && hit.tagName && hit.tagName.toLowerCase() === 'canvas') {
      y = Math.min(y + 28, f.innerHeight - 4);
    }
    try { target.dispatchEvent(mk('pointerdown', x,y)); } catch {}
    try { target.dispatchEvent(mk('mousedown',   x,y)); } catch {}
    try { target.dispatchEvent(mk('mouseup',     x,y)); } catch {}
    try { target.dispatchEvent(mk('click',       x,y)); } catch {}
    try { target.dispatchEvent(mk('pointerup',   x,y)); } catch {}
    try { target.click && target.click(); } catch {}
  }

  // remove common overlays (never remove the canvas), then focus canvas
  ['#pygbag-overlay','#gate','#status','#loading','#splash','#pygbag_status'].forEach(sel=>{
    try {
      const n = doc.querySelector(sel);
      if (n && n.tagName.toLowerCase() !== 'canvas') n.remove();
    } catch {}
  });
  try { doc.querySelector('canvas')?.focus(); } catch {}

  // cleanup: we only relay once
  window.removeEventListener('pointerdown', onFirstPointer, true);
  hideTapOverlay();
}

function onFirstPointer(e) {
  // only accept a gesture that actually hits the iframe box
  const r = gameFrame.getBoundingClientRect();
  const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
  if (!inside) return;
  e.preventDefault(); // keep the tap from scrolling anything
  setTimeout(() => relayGestureIntoIframe(e), 0);
}

if (gameFrame) {
  // always show the hint on load (desktop & mobile) — one real tap anywhere on the iframe
  showTapOverlay();

  gameFrame.addEventListener('load', () => {
    hookIframeConsole();
    hookIframeGlobals();

    // arm one-shot real gesture relay
    window.addEventListener('pointerdown', onFirstPointer, true);

    // keep leaderboard best synced while we wait for the tap
    if (lastMyBest != null) setMyBestInGame(lastMyBest);
  });

  gameFrame.src = "build/web/index.html";
} else {
  console.warn('No <iframe id="gameFrame"> found on the page.');
}

/* === Inject a one-shot in-iframe gate buster (off-center, no canvas spam) === */
function installGateBusterInIframe() {
  const f = gameFrame?.contentWindow;
  if (!f) return false;
  const doc = f.document;
  if (!doc) return false;

  // prevent double-injection on SPA reloads
  if (f.__GATE_BUSTER_INSTALLED__) return true;
  f.__GATE_BUSTER_INSTALLED__ = true;

  const code = `
    (function () {
      if (window.__gate_buster_active__) return;
      window.__gate_buster_active__ = true;

      let attempts = 0;
      let stopped  = false;
      let lastActionAt = 0;

      function now() { return performance.now(); }

      // synthesize a compact burst at a point on a specific element (not document)
      function burstOn(el, x, y) {
        try { el.focus && el.focus(); } catch {}
        const o = { bubbles:true, cancelable:true, clientX:x, clientY:y, pointerId:1, pointerType:'mouse' };
        try { el.dispatchEvent(new PointerEvent('pointerdown', o)); } catch {}
        try { el.dispatchEvent(new MouseEvent  ('mousedown',   o)); } catch {}
        try { el.dispatchEvent(new MouseEvent  ('mouseup',     o)); } catch {}
        try { el.dispatchEvent(new MouseEvent  ('click',       o)); } catch {}
        try { el.dispatchEvent(new PointerEvent('pointerup',   o)); } catch {}
        try { el.click && el.click(); } catch {}
      }

      function findTargets() {
        const input = document.querySelector('#run, #start');
        const label =
          document.querySelector('label[for="run"], label[for="start"]') ||
          document.querySelector('.pygbag-run, .start, .run, #gate, #pygbag-overlay, #status, #splash, button');
        return { input, label };
      }

      // click a few *off-center* points on the target (worked in your older build)
      function clickAround(el) {
        if (!el) return false;
        const r = el.getBoundingClientRect();
        const pts = [
          [r.left + r.width*0.50, r.top + r.height*0.66],
          [r.left + r.width*0.60, r.top + r.height*0.62],
          [r.left + r.width*0.40, r.top + r.height*0.62],
        ];
        for (let [x,y] of pts) {
          // avoid clicking the canvas (nudge down if we'd hit it)
          const hit = document.elementFromPoint(x, y);
          if (hit && hit.tagName && hit.tagName.toLowerCase() === 'canvas') {
            y = Math.min(y + 28, innerHeight - 4);
          }
          burstOn(el, x, y);
        }
        lastActionAt = now();
        return true;
      }

      function toggleInput(i) {
        if (!i) return false;
        try { i.checked = true; i.setAttribute('checked',''); } catch {}
        try { i.dispatchEvent(new Event('input', {bubbles:true})); } catch {}
        try { i.dispatchEvent(new Event('change',{bubbles:true})); } catch {}
        try { i.click && i.click(); } catch {}
        lastActionAt = now();
        return true;
      }

      function stripOverlays(keep) {
        ['#pygbag-overlay','#gate','#status','#loading','#splash','#pygbag_status']
          .forEach(sel => { try {
            const n = document.querySelector(sel);
            if (n && n !== keep) n.remove();
          } catch {} });
      }

      function focusCanvas() { try { document.querySelector('canvas')?.focus(); } catch {} }

      // We’re done when no gate-ish nodes remain and a canvas is present.
      function isClear() {
        const blockers = document.querySelector('#pygbag-overlay, #gate, #status, #splash, #run, #start, .pygbag-run, .start, .run');
        const hasCanvas = !!document.querySelector('canvas');
        return !blockers && hasCanvas;
      }

      function step() {
        if (stopped) return true;

        // if things look clear and it’s been quiet for 400ms, stop permanently
        if (isClear() && now() - lastActionAt > 400) {
          focusCanvas();
          stopped = true;
          window.__gate_buster_active__ = false;
          return true;
        }

        if (attempts >= 5) {
          // give up after a few tries to avoid spamming
          stopped = true;
          window.__gate_buster_active__ = false;
          return true;
        }

        const { input, label } = findTargets();

        // Try label/overlay first (bigger hit area, off-center clicks)
        if (label) clickAround(label);

        // Try checkbox-style gate
        if (input) toggleInput(input);

        // Remove leftover overlays (never the canvas) and focus canvas
        stripOverlays(label || input);
        focusCanvas();

        attempts++;
        return false;
      }

      const deadline = now() + 12000;
      (function loop(){
        if (stopped) return;
        if (step()) return;
        if (now() < deadline) requestAnimationFrame(loop);
      })();

      // Also react to late DOM inserts, then stop once clear
      try {
        const mo = new MutationObserver(() => {
          if (!stopped && step()) { try { mo.disconnect(); } catch {} }
        });
        mo.observe(document.documentElement, { childList:true, subtree:true });
        setTimeout(() => { try { mo.disconnect(); } catch {} }, 15000);
      } catch {}
    })();
  `;

  const s = doc.createElement('script');
  s.textContent = code;
  doc.documentElement.appendChild(s);
  return true;
}


    // Wire up on load
    if (gameFrame) {
      const IS_TOUCH = (('ontouchstart' in window) || navigator.maxTouchPoints > 0 || window.matchMedia?.('(pointer: coarse)').matches);
      if (IS_TOUCH) showTapOverlay();

      gameFrame.addEventListener('load', () => {
        hookIframeConsole();
        hookIframeGlobals();

        // Inject watcher inside iframe (this is what made it work before)
        installGateBusterInIframe();

        // tiny parent-side fallback tick (keeps myBest synced)
        const deadline = performance.now() + 8000;
        (function fallback(){
          if (performance.now() < deadline) requestAnimationFrame(fallback);
          if (lastMyBest != null) setMyBestInGame(lastMyBest);
        })();
      });

      // set src AFTER listeners are attached
      gameFrame.src = "build/web/index.html";
    } else {
      console.warn('No <iframe id="gameFrame"> found on the page.');
    }
  </script>

  <!-- Hamburger toggle -->
  <script>
    (function () {
      const nav = document.getElementById('siteNav');
      const btn = document.getElementById('navToggle');
      const menu = document.getElementById('navMenu');

      function closeMenu() {
        nav?.classList.remove('open');
        btn && btn.setAttribute('aria-expanded', 'false');
      }

      btn && btn.addEventListener('click', () => {
        const willOpen = !nav?.classList.contains('open');
        nav?.classList.toggle('open');
        btn.setAttribute('aria-expanded', String(willOpen));
      });

      menu && menu.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
    })();
  </script>
</body>
